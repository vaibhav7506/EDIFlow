services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ediflow}
      POSTGRES_USER: ${POSTGRES_USER:-ediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ediflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ediflow}
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ediflow}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres-data:
