server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location ~ ^/(api|oauth2|\.well-known)/ {
    proxy_pass https://gateway:8443;
    proxy_ssl_certificate /certs/dashboard-client.crt.pem;
    proxy_ssl_certificate_key /certs/dashboard-client.key.pem;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_name gateway;
  }
}
