apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: ediflow
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: ediflow
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        app.kubernetes.io/part-of: ediflow
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        fsGroup: 101
      containers:
        - name: dashboard
          image: ghcr.io/vaibhav7506/ediflow-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          volumeMounts:
            - name: mtls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: mtls
          secret:
            secretName: ediflow-dashboard-mtls
            defaultMode: 0440
