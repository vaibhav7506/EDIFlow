apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ediflow
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - kafka.yaml
  - redis.yaml
  - authorization-server.yaml
  - ingestion-service.yaml
  - order-service.yaml
  - gateway.yaml
  - dashboard.yaml
  - observability.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=observability-config/prometheus.yml
  - name: grafana-provisioning
    files:
      - datasource.yml=observability-config/datasource.yml
      - dashboard-provider.yml=observability-config/dashboard-provider.yml
  - name: grafana-dashboard
    files:
      - ediflow.json=observability-config/ediflow.json
images:
  - name: ghcr.io/vaibhav7506/ediflow-authorization-server
    newTag: latest
  - name: ghcr.io/vaibhav7506/ediflow-ingestion-service
    newTag: latest
  - name: ghcr.io/vaibhav7506/ediflow-order-service
    newTag: latest
  - name: ghcr.io/vaibhav7506/ediflow-gateway
    newTag: latest
  - name: ghcr.io/vaibhav7506/ediflow-dashboard
    newTag: latest
