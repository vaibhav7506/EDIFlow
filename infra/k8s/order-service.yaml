apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ediflow
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ediflow
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/part-of: ediflow
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: order-service
          image: ghcr.io/vaibhav7506/ediflow-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - { name: SERVER_PORT, value: "8082" }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: ediflow-config, key: KAFKA_BOOTSTRAP_SERVERS } }
            - name: JDBC_DATABASE_URL
              valueFrom: { configMapKeyRef: { name: ediflow-config, key: JDBC_DATABASE_URL } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: ediflow-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ediflow-app-secrets, key: POSTGRES_PASSWORD } }
            - name: ACTIVE_PARTNER_CODES
              valueFrom: { configMapKeyRef: { name: ediflow-config, key: ACTIVE_PARTNER_CODES } }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
