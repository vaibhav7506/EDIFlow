apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: ediflow
spec:
  selector:
    app: ingestion-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: ediflow
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
        app.kubernetes.io/part-of: ediflow
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: ingestion-service
          image: ghcr.io/vaibhav7506/ediflow-ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - { name: SERVER_PORT, value: "8081" }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: ediflow-config, key: KAFKA_BOOTSTRAP_SERVERS } }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
