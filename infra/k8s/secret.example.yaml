# Example schema only. The deployment workflow creates these Secrets from
# GitHub Actions secrets; never put real values in this file.
apiVersion: v1
kind: Secret
metadata:
  name: ediflow-app-secrets
  namespace: ediflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  B2B_CLIENT_SECRET: replace-me
  READER_CLIENT_SECRET: replace-me
  ADMIN_CLIENT_SECRET: replace-me
  GRAFANA_ADMIN_PASSWORD: replace-me
  TLS_STORE_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: ediflow-gateway-tls
  namespace: ediflow
type: Opaque
data:
  gateway.p12: ""
  truststore.p12: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ediflow-dashboard-mtls
  namespace: ediflow
type: Opaque
stringData:
  dashboard-client.crt.pem: replace-me
  dashboard-client.key.pem: replace-me
  ca.crt: replace-me
