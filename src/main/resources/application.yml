spring:
  application:
    name: ediflow
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ediflow}
    username: ${POSTGRES_USER:ediflow}
    password: ${POSTGRES_PASSWORD:ediflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
